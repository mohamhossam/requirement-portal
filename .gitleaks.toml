# Secret scanning for CI (production hardening PR 11): gitleaks' default rules, plus
# the one exception below.

[extend]
useDefault = true

[[allowlists]]
description = "CI-only credentials: the throwaway stack in ci.yml's deployment job uses them, and nothing else accepts them. Anchored to the detected secret itself, so a real secret on a line that merely mentions ci-only is still reported."
regexTarget = "secret"
# The optional `admin:` covers gitleaks' curl-auth-user rule, whose secret
# capture is the whole `user:password` of CI's `curl -u admin:ci-only`.
regexes = ['''^['"]?(admin:)?ci-only[a-z0-9-]*['"]?$''']
