name: CI

on:
  # Only the default branch on push: a branch with an open pull request is
  # already covered by the pull_request trigger, and listing both ran every
  # commit twice.
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smb_requirement_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smb_requirement_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smb_requirement_agent_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Read access to platform-kernel
        # The kernel is a private git dependency (ADR-0100). The token is a
        # fine-grained, read-only token for that one repository.
        env:
          KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
        run: |
          test -n "$KERNEL_READ_TOKEN" || { echo "KERNEL_READ_TOKEN secret is not set"; exit 1; }
          kernel="github.com/mohamhossam/platform-kernel"
          git config --global "url.https://x-access-token:${KERNEL_READ_TOKEN}@${kernel}.insteadOf" "https://${kernel}"

      - name: Install locked project
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: pytest with coverage
        # The floor lives in pyproject.toml ([tool.coverage.report] fail_under).
        run: pytest --cov --cov-report=term

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy src tests

      - name: lint-imports
        run: lint-imports

  postgres-architecture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_DB: smb_test
          POSTGRES_USER: smb_test
          POSTGRES_PASSWORD: smb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smb_test -d smb_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://smb_test:smb_test@localhost:5432/smb_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Read access to platform-kernel
        # The kernel is a private git dependency (ADR-0100). The token is a
        # fine-grained, read-only token for that one repository.
        env:
          KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
        run: |
          test -n "$KERNEL_READ_TOKEN" || { echo "KERNEL_READ_TOKEN secret is not set"; exit 1; }
          kernel="github.com/mohamhossam/platform-kernel"
          git config --global "url.https://x-access-token:${KERNEL_READ_TOKEN}@${kernel}.insteadOf" "https://${kernel}"

      - name: Install locked project
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: PostgreSQL and pgvector integration
        run: >-
          pytest tests/integration/test_postgres_persistence.py
          tests/integration/test_postgres_architecture_jobs.py
          tests/integration/test_requirement_mapping_jobs.py
          tests/integration/test_architecture_mapping_stats_postgres.py
          tests/integration/test_reference_publication_state.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci --loglevel verbose

      - name: OpenAPI type drift
        run: npm run api:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Component tests with coverage
        # Floors live in vitest.config.ts (coverage.thresholds).
        run: npm run test:coverage

      - name: Build
        run: npm run build

  supply-chain:
    # Known-vulnerable dependencies fail the build. Python audits what the
    # image ships (no dev tools); npm audits everything, since its dev tooling
    # runs in CI and builds the served bundle.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Python dependency audit
        run: |
          uv export --frozen --no-dev --no-emit-project --no-emit-package smb-platform-kernel --format requirements-txt > requirements.txt
          uvx pip-audit==2.10.1 --strict --disable-pip --no-deps -r requirements.txt

      - name: Python dependency audit (document-ocr extra)
        # Not in the image, but an operator who extends it for OCR installs
        # this tree (docling and its model stack), so it is audited too.
        run: |
          uv export --frozen --no-dev --no-emit-project --no-emit-package smb-platform-kernel --extra document-ocr --format requirements-txt > requirements-ocr.txt
          uvx pip-audit==2.10.1 --strict --disable-pip --no-deps -r requirements-ocr.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  deployment:
    # Builds both images and brings requirement work up offline beside the
    # knowledge portal's pinned release, each from its own repository's manifest
    # and joined on the peer network (ADR-0104), so a broken Dockerfile, nginx
    # template, entrypoint or service wiring fails here, not in a deploy.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      POSTGRES_PASSWORD: ci-only
      KNOWLEDGE_POSTGRES_PASSWORD: ci-only
      REQUIREMENT_SERVICE_TOKEN: ci-only-requirement-service-token-0000
      KNOWLEDGE_SERVICE_TOKEN: ci-only-knowledge-service-token-000000
      GRAFANA_ADMIN_PASSWORD: ci-only
      # The knowledge-portal release both its manifest and its images come from.
      KNOWLEDGE_IMAGE_TAG: v0.2.0
      # Each portal's links to the other, through the other's edge.
      KNOWLEDGE_PORTAL_URL: http://127.0.0.1:8090/knowledge/
      REQUIREMENT_PORTAL_URL: http://127.0.0.1:8080/
      # The demo overlay runs the development personas these checks sign in as; the
      # production manifest on its own is checked in its own step below.
      COMPOSE: docker compose -f deploy/compose.production.yaml -f deploy/compose.peer.yaml -f deploy/compose.demo.yaml
      KNOWLEDGE: docker compose -f knowledge-portal/deploy/compose.production.yaml -f knowledge-portal/deploy/compose.peer.yaml
      # Passed to the image build as a BuildKit secret, never as a build arg.
      KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the knowledge portal's release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mohamhossam/knowledge-portal
          ref: ${{ env.KNOWLEDGE_IMAGE_TAG }}
          path: knowledge-portal
          persist-credentials: false

      - name: The vendored knowledge contract matches the pinned release
        # Requirement work's adapters are built and tested against
        # contracts/knowledge-internal.openapi.json; it must be the one the pinned
        # knowledge-portal release serves (ADR-0099). Moving KNOWLEDGE_IMAGE_TAG
        # means copying that release's contract here too.
        run: diff -u knowledge-portal/contracts/knowledge-internal.openapi.json contracts/knowledge-internal.openapi.json

      - name: Offline deployment settings
        run: |
          cat > deploy/production.env <<SETTINGS
          APP_ENV=development
          IDENTITY_PROVIDER=fake
          LLM_PROVIDER=fake
          ATTACHMENT_SCAN_MODE=clamav
          KNOWLEDGE_API_BASE_URL=http://knowledge-api:8000
          REQUIREMENT_SERVICE_TOKEN=$REQUIREMENT_SERVICE_TOKEN
          KNOWLEDGE_SERVICE_TOKEN=$KNOWLEDGE_SERVICE_TOKEN
          SETTINGS
          cat > knowledge-portal/deploy/production.env <<SETTINGS
          APP_ENV=development
          IDENTITY_PROVIDER=fake
          LLM_PROVIDER=fake
          REQUIREMENT_API_BASE_URL=http://requirement-api:8000
          REQUIREMENT_SERVICE_TOKEN=$REQUIREMENT_SERVICE_TOKEN
          KNOWLEDGE_SERVICE_TOKEN=$KNOWLEDGE_SERVICE_TOKEN
          SETTINGS
          docker network create platform-internal

      - name: Pull the knowledge portal's release
        run: $KNOWLEDGE pull api web

      - name: Build images
        run: $COMPOSE build

      - name: Scan images for fixable HIGH and CRITICAL vulnerabilities
        run: |
          for image in requirement-platform/api:local requirement-platform/web:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 "$image"
          done

      - name: First install, then start both portals
        run: |
          $COMPOSE run --rm maintenance
          # The scanners load their signatures while the checks below run.
          $COMPOSE up -d clamav
          $KNOWLEDGE up -d clamav
          $COMPOSE up -d --wait web worker
          $KNOWLEDGE up -d --wait edge worker

      - name: Ready through each edge, with security headers
        run: |
          curl --fail --silent http://127.0.0.1:8080/api/ready
          curl --fail --silent http://127.0.0.1:8090/knowledge-api/ready
          curl --fail --silent --head http://127.0.0.1:8080/ | grep -i "frame-ancestors 'none'"
          curl --fail --silent http://127.0.0.1:8080/ | grep -q 'http-equiv="Content-Security-Policy"'
          # Service-to-service routes never pass an edge (ADR-0099).
          for url in http://127.0.0.1:8080/api/internal/architecture-mapping/stats \
                     http://127.0.0.1:8090/knowledge-api/internal/events; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' "$url")
            test "$code" = 404 || { echo "$url answered $code at the edge"; exit 1; }
          done
          # Nor does the API's generated documentation.
          for path in /api/docs /api/docs/oauth2-redirect /api/redoc /api/openapi.json; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8080$path")
            test "$code" = 404 || { echo "$path answered $code at the edge"; exit 1; }
          done
          # Requirement work's edge serves nothing of the knowledge portal, and
          # sends old bookmarks to its own address (ADR-0104).
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/knowledge-api/ready)
          test "$code" = 404 || { echo "/knowledge-api/ready answered $code on requirement work's edge"; exit 1; }
          location=$(curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' \
            'http://127.0.0.1:8080/knowledge/library?view=all')
          test "$location" = "301 http://127.0.0.1:8090/knowledge/library?view=all" ||
            { echo "An old bookmark answered: $location"; exit 1; }
          # The knowledge portal's browser app, on its own edge, client routes included.
          curl --fail --silent http://127.0.0.1:8090/knowledge/ | grep -q '<title>Knowledge portal</title>'
          curl --fail --silent http://127.0.0.1:8090/knowledge/library | grep -q '<title>Knowledge portal</title>'

      - name: The production manifest boots in production and refuses development settings
        # Without the demo overlay the manifest pins APP_ENV=production and OIDC sign-in.
        # OIDC discovery is lazy, so a placeholder HTTPS issuer is enough to boot and to
        # refuse a request without a token; a placeholder OpenAI key is never called.
        env:
          PROD: docker compose -f deploy/compose.production.yaml
          PRODUCTION_SETTINGS: >-
            -e OIDC_ISSUER_URL=https://identity.ci.invalid/realms/requirement-ai
            -e OIDC_AUDIENCE=requirement-api
            -e OIDC_CLIENT_ID=requirement-spa
            -e LLM_PROVIDER=openai
            -e OPENAI_API_KEY=ci-only
        run: |
          $PROD run --rm --no-deps $PRODUCTION_SETTINGS api \
            python -m smb_requirement_agent.interfaces.deployment_preflight
          $PROD run -d --no-deps --name api-production $PRODUCTION_SETTINGS api
          trap 'docker logs api-production; docker rm -f api-production > /dev/null' EXIT
          for attempt in $(seq 1 30); do
            docker exec api-production python -c \
              "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/ready', timeout=3)" \
              2> /dev/null && break
            sleep 2
          done
          docker exec api-production python -c "
          import urllib.error, urllib.request
          for headers in ({}, {'X-Fake-Actor-Id': 'fake-owner'}):
              request = urllib.request.Request('http://127.0.0.1:8000/identity/me', headers=headers)
              try:
                  urllib.request.urlopen(request, timeout=3)
              except urllib.error.HTTPError as error:
                  assert error.code == 401, (headers, error.code)
              else:
                  raise SystemExit(f'Answered without a token: {headers}')
          "
          # A development setting slipped into production stops the boot (an API still
          # running at the timeout answers 124) or the preflight.
          set +e
          timeout 120 $PROD run --rm --no-deps $PRODUCTION_SETTINGS -e IDENTITY_PROVIDER=fake api
          boot=$?
          $PROD run --rm --no-deps $PRODUCTION_SETTINGS -e LLM_PROVIDER=fake api \
            python -m smb_requirement_agent.interfaces.deployment_preflight
          preflight=$?
          set -e
          test "$boot" != 0 && test "$boot" != 124 ||
            { echo "The API booted with fake identity in production ($boot)"; exit 1; }
          test "$preflight" = 2 || { echo "The preflight answered $preflight for the fake model"; exit 1; }

      - name: The portals reach each other on the peer network
        run: |
          # Requirement work learns of the knowledge database's initial catalogue
          # version through the knowledge event feed.
          for attempt in $(seq 1 30); do
            release=$(curl --fail --silent http://127.0.0.1:8080/api/architecture/active-release)
            echo "$release" | grep -q '"id":"smb-source-reference-v1"' && break
            sleep 2
          done
          echo "$release" | grep -q '"id":"smb-source-reference-v1"' ||
            { echo "Requirement work never saw the active catalogue: $release"; exit 1; }
          # And the knowledge portal finds requirement work by its peer name.
          $KNOWLEDGE exec -T api python -c \
            "import urllib.request as u; u.urlopen('http://requirement-api:8000/ready', timeout=5)"
          # The knowledge portal answers its own admins, through its own edge.
          curl --fail --silent -H "X-Fake-Actor-Id: fake-owner" \
            http://127.0.0.1:8090/knowledge-api/library/documents > /dev/null
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "X-Fake-Actor-Id: fake-observer" http://127.0.0.1:8090/knowledge-api/library/documents)
          test "$code" = 403

      - name: A withdrawal reaches requirement work within one poll
        # A library document is published and withdrawn in the knowledge portal, through
        # its edge; requirement work's copy, which judges citations current, follows the
        # event feed (ADR-0099). Uploads are scanned, so the scanner must be ready first.
        run: |
          $KNOWLEDGE up -d --wait --wait-timeout 600 clamav
          python3 tests/platform_withdrawal.py \
            --knowledge-url http://127.0.0.1:8090/knowledge-api \
            --requirements-psql "$COMPOSE exec -T postgres psql -U smb -d smb_requirements"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: The platform in a browser
        # Playwright against both edges (frontend/platform-tests): a citation read-only
        # by a member, the knowledge portal for admins only.
        working-directory: frontend
        env:
          KNOWLEDGE_URL: http://127.0.0.1:8090
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.platform.config.ts

      - name: Model files are mounted read-only
        run: |
          for service in api worker; do
            $COMPOSE exec -T "$service" test -r /app/config/llm.yaml
          done
          ! $COMPOSE exec -T api touch /app/config/written

      - name: Monitoring add-on scrapes both exporters and serves its dashboard
        run: |
          MONITORING="$COMPOSE -f deploy/compose.monitoring.yaml"
          $MONITORING up -d --wait prometheus grafana
          $MONITORING exec -T prometheus promtool check config /etc/prometheus/prometheus.yml
          for attempt in $(seq 1 30); do
            up=$($MONITORING exec -T prometheus wget -qO- \
              'http://127.0.0.1:9090/api/v1/query?query=count(up%7Bjob%3D~%22api%7Cworker%22%7D%3D%3D1)' |
              python3 -c 'import json, sys; r = json.load(sys.stdin)["data"]["result"]; print(r[0]["value"][1] if r else 0)')
            [ "$up" = "2" ] && break
            sleep 2
          done
          [ "$up" = "2" ] || { echo "Prometheus scrapes $up of 2 exporters"; exit 1; }
          curl --fail --silent -u admin:ci-only \
            'http://127.0.0.1:3000/api/dashboards/uid/requirement-ai-overview' > /dev/null
          curl --fail --silent -u admin:ci-only \
            'http://127.0.0.1:3000/api/datasources/uid/prometheus/health' | grep -q '"status":"OK"'

      - name: Container logs
        if: failure()
        run: |
          $COMPOSE -f deploy/compose.monitoring.yaml logs
          $KNOWLEDGE logs

  recovery:
    # A nonempty backup/restore rehearsal (docs/operations/release-qualification.md):
    # seed reviewed content and history, pg_dump, pg_restore into a new database,
    # then verify checksums, history, access, search and maintenance. Same pinned
    # PostgreSQL image as everywhere else (tests/architecture/test_image_pins.py).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Read access to platform-kernel
        # The kernel is a private git dependency (ADR-0100). The token is a
        # fine-grained, read-only token for that one repository.
        env:
          KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
        run: |
          test -n "$KERNEL_READ_TOKEN" || { echo "KERNEL_READ_TOKEN secret is not set"; exit 1; }
          kernel="github.com/mohamhossam/platform-kernel"
          git config --global "url.https://x-access-token:${KERNEL_READ_TOKEN}@${kernel}.insteadOf" "https://${kernel}"

      - name: Install locked project
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Seed reviewed content and immutable history
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U postgres codex_qualification_test_source
          python -m tests.release_recovery seed --database-url postgresql://postgres:postgres@127.0.0.1:5432/codex_qualification_test_source --manifest recovery-manifest.json

      - name: Back up and restore into a new database
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U postgres -Fc -d codex_qualification_test_source -f /tmp/recovery.dump
          docker exec ${{ job.services.postgres.id }} createdb -U postgres codex_qualification_test_restored
          docker exec ${{ job.services.postgres.id }} pg_restore -U postgres --exit-on-error --no-owner -d codex_qualification_test_restored /tmp/recovery.dump

      - name: Verify checksums, history, access, search and maintenance
        run: |
          python -m tests.release_recovery verify --database-url postgresql://postgres:postgres@127.0.0.1:5432/codex_qualification_test_restored --manifest recovery-manifest.json > recovery-result.json
          cat recovery-result.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: recovery-pg17
          path: recovery-*.json

  smoke:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Read access to platform-kernel
        # The kernel is a private git dependency (ADR-0100). The token is a
        # fine-grained, read-only token for that one repository.
        env:
          KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
        run: |
          test -n "$KERNEL_READ_TOKEN" || { echo "KERNEL_READ_TOKEN secret is not set"; exit 1; }
          kernel="github.com/mohamhossam/platform-kernel"
          git config --global "url.https://x-access-token:${KERNEL_READ_TOKEN}@${kernel}.insteadOf" "https://${kernel}"

      - name: Install locked project
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci --loglevel verbose
          npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        working-directory: frontend
        env:
          LLM_PROVIDER: fake
        run: npm run test:smoke
