<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Knowledge portal unavailable</title>
  <style>
    :root { color-scheme: light dark; --ink: #1d1d1f; --muted: #55565b; --surface: #fbfaf7; --line: #d9d6cf; --accent: #3b4bb8; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #ecebe8; --muted: #b3b1ab; --surface: #16161a; --line: #3a3a40; --accent: #a9b3ff; }
    }
    body { margin: 0; background: var(--surface); color: var(--ink); font: 1rem/1.5 system-ui, sans-serif; }
    main { max-width: 36rem; margin: 0 auto; padding: 4rem 1rem; }
    h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 1rem; }
    p { margin: 0 0 1rem; color: var(--muted); }
    a { color: var(--accent); display: inline-block; min-height: 24px; padding: 2px 0; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>The knowledge portal is not available</h1>
    <p>The shared library and the catalogues can't be opened right now. Either the portal isn't
      running, or it hasn't been deployed here yet.</p>
    <p>Citations and architecture evidence still open, read-only, from each requirement.</p>
    <p><a href="/documents">Back to Documents</a></p>
  </main>
</body>
</html>
