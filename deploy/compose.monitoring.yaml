# Optional monitoring for deploy/compose.production.yaml:
# - Prometheus scrapes the API and worker exporters (port 9464), PostgreSQL and the
#   host, and evaluates the alerts (docs/operations/alerts.md);
# - Alertmanager sends them to the receiver you choose (ALERTMANAGER_RECEIVER);
# - Grafana shows a ready-made dashboard;
# - the OpenTelemetry Collector receives the API's and workers' traces and Tempo keeps
#   them, browsed in Grafana's Explore view (ADR-0110).
# Add this file to the usual command:
#
#   export GRAFANA_ADMIN_PASSWORD=...
#   export ALERTMANAGER_RECEIVER=webhook ALERTMANAGER_URL=https://...   # or none (default), slack
#   docker compose -f deploy/compose.production.yaml -f deploy/compose.monitoring.yaml up -d
#
# Grafana is published on 127.0.0.1:3000 only (sign in as `admin`); put it
# behind TLS and your identity provider before exposing it further. Prometheus
# and Alertmanager stay on the private network, as do the collector and Tempo. See
# docs/operations/deployment.md ("Metrics" and "Tracing").

services:
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/alerts.test.yml:/etc/prometheus/alerts.test.yml:ro
      - prometheus_data:/prometheus
    # promtool test rules builds its scratch storage here.
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

  # Renders its configuration for ALERTMANAGER_RECEIVER at start. The receiver's URL is
  # written to a private file on the tmpfs; the configuration names the file, not the URL.
  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      ALERTMANAGER_RECEIVER: ${ALERTMANAGER_RECEIVER:-none}
      ALERTMANAGER_URL: ${ALERTMANAGER_URL:-}
    volumes:
      - ./monitoring/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

  # Connections, settings and database size, read as the application's own user. The
  # password is passed like the API's DATABASE_URL: Compose can give a read-only container
  # only a file-backed secret, and POSTGRES_PASSWORD is not a file.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      DATA_SOURCE_URI: postgres:5432/smb_requirements?sslmode=disable
      DATA_SOURCE_USER: smb
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

  # The host's disks, memory and CPU, read through a read-only view of its root.
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Applies when Grafana first creates its database; change it later in the UI.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # The root filesystem is read-only, so the plugins bundled in the image are the
      # ones Grafana runs. Left on, the background installer stops a bundled plugin
      # to "update" it from the online catalog, fails to write, and the Prometheus
      # data source is gone until a restart.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/requirement-ai.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      prometheus:
        condition: service_healthy

  # The one OTLP/HTTP endpoint the API and workers export to. It batches and forwards
  # to Tempo; point OTEL_EXPORTER_OTLP_ENDPOINT at your own collector to skip it.
  otel-collector:
    image: otel/opentelemetry-collector:0.159.0@sha256:7725a7a10c87d8853208bdd4bb3439ad3c0d7b32b4292b9300ac07c8daba14a2
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./monitoring/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      tempo:
        condition: service_started

  # Keeps traces for TEMPO_RETENTION on its volume; Grafana queries it.
  tempo:
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    command:
      - -target=all
      - -config.file=/etc/tempo/tempo.yaml
      # Both halves of Tempo 3's compaction keep traces this long, then delete them.
      - -backend-scheduler.provider.work.compaction.block-retention=${TEMPO_RETENTION:-72h}
      - -backend-worker.compaction.block-retention=${TEMPO_RETENTION:-72h}
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    # The image has no shell or HTTP client for a healthcheck; Grafana's data source
    # check and the deployment job's trace query show it serving.
    tmpfs:
      - /tmp
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

  # The API and workers send their traces to the bundled collector.
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  tempo_data:
