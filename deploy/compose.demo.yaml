# Local demo only: layered over compose.production.yaml, it runs requirement work
# with the development personas instead of a sign-in, and publishes the app on
# this machine alone.
#
#   docker compose -f deploy/compose.production.yaml -f deploy/compose.demo.yaml up -d
#
# Anyone who can reach a demo can act as any persona, so `web` listens on
# 127.0.0.1 only. Never use this file for a shared or public deployment; the
# production manifest on its own always runs APP_ENV=production with OIDC.

x-demo-environment: &demo-environment
  APP_ENV: development
  IDENTITY_PROVIDER: fake

services:
  migrate:
    environment: *demo-environment
  maintenance:
    environment: *demo-environment
  retention:
    environment: *demo-environment
  api:
    environment: *demo-environment
  worker:
    environment: *demo-environment
  web:
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
