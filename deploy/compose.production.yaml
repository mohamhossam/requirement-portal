# Reference deployment of requirement work: one host, every process in its own
# container, built from this repository. The knowledge portal deploys on its
# own, from knowledge-portal's repository (ADR-0104).
#
#   cp deploy/production.env.example deploy/production.env   # then fill it in
#   docker compose -f deploy/compose.production.yaml up -d --build
#
# It always runs in production mode with OIDC sign-in: APP_ENV and
# IDENTITY_PROVIDER are set below, not in production.env, so a missing line there
# cannot open the stack to development personas. A local demo layers
# deploy/compose.demo.yaml over this file; never deploy with it.
#
# The browser reaches only `web` (port 8080; put TLS in front of it). It serves
# the app at / and the API at /api/. The API, worker, database, scanner and
# metrics ports stay on the private network, and /internal never passes the
# edge. The knowledge portal is optional: with KNOWLEDGE_API_BASE_URL unset in
# production.env, requirement work runs alone; deploy/compose.peer.yaml
# connects the two on one host. See docs/operations/deployment.md for the
# process model, secrets and scaling.

# Not `requirement-ai`: the earlier single-repository deployment uses that name,
# and the two may run side by side on one host.
name: requirement-platform

x-backend: &backend
  image: requirement-platform/api:${IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: deploy/api/Dockerfile
    # platform-kernel is a private git dependency (ADR-0100); see `secrets` below.
    secrets:
      - kernel_read_token
  env_file:
    - path: production.env
      required: true
  environment: &backend-environment
    APP_ENV: production
    IDENTITY_PROVIDER: oidc
    PERSISTENCE_PROVIDER: postgres
    DATABASE_URL: postgresql://smb:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/smb_requirements
    ATTACHMENT_SCANNER_HOST: clamav
    ATTACHMENT_SCANNER_PORT: "3310"
    LOG_FORMAT: json
    METRICS_HOST: 0.0.0.0
    METRICS_PORT: "9464"
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  # Files the settings name by path, mounted read-only. Relative host paths
  # resolve from this directory; a missing one fails the start instead of
  # mounting an empty directory. See docs/operations/deployment.md.
  volumes:
    # Model profiles: LLM_CONFIG_PATH=/app/config/llm.yaml
    - type: bind
      source: ${LLM_CONFIG_DIR:-../config}
      target: /app/config
      read_only: true
      bind:
        create_host_path: false
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: smb_requirements
      POSTGRES_USER: smb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smb -d smb_requirements"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Uploads are scanned before extraction. Loading signatures takes a
  # few minutes on first start; ingestion waits, the rest of the app does not.
  clamav:
    image: clamav/clamav:1.5@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

  # Schema changes run once, before any API or worker starts, never on boot.
  migrate:
    <<: *backend
    command: ["python", "-m", "smb_requirement_agent.infrastructure.persistence.migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # First install, and maintenance windows only (docs/operations/deployment.md):
  #   docker compose -f deploy/compose.production.yaml run --rm maintenance
  # Rebuilds the derived projections and records the marker /ready requires.
  # Never run it while an API or worker is up.
  maintenance:
    <<: *backend
    command: ["python", "-m", "smb_requirement_agent.interfaces.maintenance"]
    restart: "no"
    profiles: ["maintenance"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Online: prunes read notifications (ADR-0079). Schedule it, e.g. daily:
  # docker compose -f deploy/compose.production.yaml run --rm retention
  retention:
    <<: *backend
    command: ["python", "-m", "smb_requirement_agent.interfaces.retention"]
    restart: "no"
    profiles: ["retention"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *backend
    # Only `web` connects to the API, so it may set X-Forwarded-* headers.
    command:
      - python
      - -m
      - smb_requirement_agent.interfaces.api.serve
      - --host=0.0.0.0
      - --port=8000
      - --forwarded-allow-ips=*
    environment:
      <<: *backend-environment
      # HTTP only; background work runs in `worker`, which scales separately.
      API_BACKGROUND_WORKERS: "false"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Exits non-zero when a worker stops being healthy; the restart policy
  # replaces it. Scale with `--scale worker=N`: jobs are leased in PostgreSQL.
  worker:
    <<: *backend
    command: ["python", "-m", "smb_requirement_agent.interfaces.worker"]
    stop_grace_period: 3m
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: requirement-platform/web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
      args:
        CSP_IDENTITY_ORIGINS: ${CSP_IDENTITY_ORIGINS:-}
        # Where the knowledge portal is, for its links; empty hides them (ADR-0104).
        VITE_KNOWLEDGE_PORTAL_URL: ${KNOWLEDGE_PORTAL_URL:-}
    environment:
      # Old /knowledge/ bookmarks redirect here for one release; empty answers 404.
      KNOWLEDGE_PORTAL_URL: ${KNOWLEDGE_PORTAL_URL:-}
    # WEB_PORT moves it off 8080, e.g. beside the earlier deployment.
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    # nginx-unprivileged runs as uid 101 and renders its config into conf.d.
    tmpfs:
      - /tmp:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy

# A fine-grained, read-only token for mohamhossam/platform-kernel, used only while
# building the backend image. Export KERNEL_READ_TOKEN before `docker compose build`.
secrets:
  kernel_read_token:
    environment: KERNEL_READ_TOKEN

volumes:
  postgres_data:
  clamav_data:
