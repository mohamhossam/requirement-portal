# Scrapes requirement work's exporters in deploy/compose.production.yaml
# (METRICS_PORT=9464), and the monitoring overlay's PostgreSQL, host and Alertmanager
# exporters. The knowledge portal's exporters belong to its own deployment.
# Docker's DNS returns one address per replica, so `--scale api=N` and
# `--scale worker=N` are picked up without editing this file.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9464
        refresh_interval: 30s

  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9464
        refresh_interval: 30s

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
